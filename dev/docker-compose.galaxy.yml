# Galaxy compose override
#
# Use with: -f dev/docker-compose.yml -f dev/docker-compose.galaxy.yml
#
# On Galaxy machines the repos are direct git clones (not worktree bare-repo
# mounts), so volume paths match the standard layout.

services:
  vllm-tt:
    volumes:
      - ${WORKSPACE_PATH}/tt-metal:/tt-metal:rw
      - ${WORKSPACE_PATH}/vllm:/vllm:rw
      - /dev/hugepages-1G:/dev/hugepages-1G
      - ${HOME}/.cache/huggingface:/cache/huggingface
      - ${HOME}/models:${HOME}/models:ro
      - ${HOME}/.cache/tt-model-cache:/tt-metal/model_cache
      - ${HOME}/.cache/ttnn:/root/.cache/ttnn
      - ${HOME}/.cache/tt-metal-cache:/root/.cache/tt-metal-cache
      - tt-metal-build:/tt-metal/build
    environment:
      # GLM4_MOE (REAP-218B) bring-up knobs — NOT passed by base compose
      - GLM4_MOE_TP=${GLM4_MOE_TP:-}
      - GLM4_MOE_EP=${GLM4_MOE_EP:-}
      - GLM4_MOE_DENSE_TT_DTYPE=${GLM4_MOE_DENSE_TT_DTYPE:-}
      - GLM4_MOE_EXPERTS_TT_DTYPE=${GLM4_MOE_EXPERTS_TT_DTYPE:-}
      - GLM4_MOE_EXPERTS_W1_DTYPE=${GLM4_MOE_EXPERTS_W1_DTYPE:-}
      - GLM4_MOE_EXPERTS_W2_DTYPE=${GLM4_MOE_EXPERTS_W2_DTYPE:-}
      - GLM4_MOE_EXPERTS_W3_DTYPE=${GLM4_MOE_EXPERTS_W3_DTYPE:-}
      - GLM4_MOE_KV_CACHE_TT_DTYPE=${GLM4_MOE_KV_CACHE_TT_DTYPE:-}
      - GLM4_MOE_ENABLE_MOE=${GLM4_MOE_ENABLE_MOE:-}
      - GLM4_MOE_MOE_EXPERTS_IMPL=${GLM4_MOE_MOE_EXPERTS_IMPL:-}
      - GLM4_MOE_MOE_ROUTER_IMPL=${GLM4_MOE_MOE_ROUTER_IMPL:-}
      - GLM4_MOE_MOE_DENSE_PREFILL=${GLM4_MOE_MOE_DENSE_PREFILL:-}
      - GLM4_MOE_MOE_SPARSE_PREFILL_PCM=${GLM4_MOE_MOE_SPARSE_PREFILL_PCM:-}
      - GLM4_MOE_MOE_SPARSE_FP32_ACC=${GLM4_MOE_MOE_SPARSE_FP32_ACC:-}
      - GLM4_MOE_MOE_SPARSE_FIDELITY=${GLM4_MOE_MOE_SPARSE_FIDELITY:-}
      - GLM4_MOE_SKIP_DEFENSIVE_CLONES=${GLM4_MOE_SKIP_DEFENSIVE_CLONES:-}
      - GLM4_MOE_EXPLICIT_PROG_CFG=${GLM4_MOE_EXPLICIT_PROG_CFG:-}
      - GLM4_MOE_DECODE_L1_ACT=${GLM4_MOE_DECODE_L1_ACT:-}
      - GLM4_MOE_EP_L1=${GLM4_MOE_EP_L1:-}
      - GLM4_MOE_FP32_ACC=${GLM4_MOE_FP32_ACC:-}
      - GLM4_MOE_ATTN_FIDELITY=${GLM4_MOE_ATTN_FIDELITY:-}
      - GLM4_MOE_REDUCE_IMPL=${GLM4_MOE_REDUCE_IMPL:-}
      - GLM4_MOE_REDUCE_IMPL_AXIS1=${GLM4_MOE_REDUCE_IMPL_AXIS1:-}
      - GLM4_MOE_FUSE_SHARED_EP_REDUCE=${GLM4_MOE_FUSE_SHARED_EP_REDUCE:-}
      - GLM4_MOE_EP_REDUCE_DEVICE=${GLM4_MOE_EP_REDUCE_DEVICE:-}
      - GLM4_MOE_DRAM_SHARD=${GLM4_MOE_DRAM_SHARD:-}
      - GLM4_MOE_FUSE_EXPERTS_GATE_UP=${GLM4_MOE_FUSE_EXPERTS_GATE_UP:-}
      - GLM4_MOE_NUM_LAYERS=${GLM4_MOE_NUM_LAYERS:-}
      - GLM4_MOE_DEBUG_ALLOW_PARTIAL_LAYERS=${GLM4_MOE_DEBUG_ALLOW_PARTIAL_LAYERS:-}
      - GLM4_MOE_DEBUG_SYNC=${GLM4_MOE_DEBUG_SYNC:-}
      - GLM4_MOE_DEBUG_DECODE=${GLM4_MOE_DEBUG_DECODE:-}
      - GLM4_MOE_DEBUG_TRACE_VERIFY=${GLM4_MOE_DEBUG_TRACE_VERIFY:-}
      - GLM4_MOE_DEBUG_PT_WIDTH=${GLM4_MOE_DEBUG_PT_WIDTH:-}
      # Additional env vars that might be needed
      - NUM_GPU_BLOCKS_OVERRIDE=${NUM_GPU_BLOCKS_OVERRIDE:-}
      - VLLM_TT_DECODE_ONLY=${VLLM_TT_DECODE_ONLY:-}
      - VLLM_TT_WARMUP_OVERRIDE=${VLLM_TT_WARMUP_OVERRIDE:-}
