include:
  - path: ../base/docker-compose.yml

services:
  vllm-tt:
    build:
      context: ..
      dockerfile: dev/Dockerfile
    image: vllm-tt-dev:latest
    networks:
      - tt-net
    ports:
      - "8088:8088"
    devices:
      - /dev/tenstorrent:/dev/tenstorrent
    volumes:
      # Bind mount source directories from workspace
      - ${WORKSPACE_PATH}/tt-metal:/tt-metal:rw
      - ${WORKSPACE_PATH}/vllm:/vllm:rw
      # Git worktree support (tt-metal/vllm are typically git worktrees).
      # The worktree .git file points to the bare repo under /home/ttuser/src_docker/*.git,
      # so we mount those paths into the container to keep `git describe` etc working.
      - ${WORKSPACE_PATH}/tt-metal:${WORKSPACE_PATH}/tt-metal:rw
      - ${WORKSPACE_PATH}/vllm:${WORKSPACE_PATH}/vllm:rw
      - /home/ttuser/src_docker/tt-metal.git:/home/ttuser/src_docker/tt-metal.git:ro
      - /home/ttuser/src_docker/vllm.git:/home/ttuser/src_docker/vllm.git:ro
      # Standard caches
      - /dev/hugepages-1G:/dev/hugepages-1G
      - ${HOME}/.cache/huggingface:/cache/huggingface
      - ${HOME}/.cache/tt-model-cache:/tt-metal/model_cache
      - ${HOME}/.cache/ttnn:/root/.cache/ttnn
      - ${HOME}/.cache/tt-metal-cache:/root/.cache/tt-metal-cache
      # Persist the python venv across container recreates (model switches, etc.)
      - vllm-tt-venv:/opt/venv
      # Persist tt-metal build artifacts to avoid rebuilding
      - tt-metal-build:/tt-metal/build
    environment:
      - HF_MODEL=${HF_MODEL:-Qwen/Qwen3-0.6B}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/cache/huggingface
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-}
      - TRANSFORMERS_OFFLINE=${TRANSFORMERS_OFFLINE:-}
      - VLLM_RPC_TIMEOUT=${VLLM_RPC_TIMEOUT:-600000}
      - VLLM_ENGINE_ITERATION_TIMEOUT_S=${VLLM_ENGINE_ITERATION_TIMEOUT_S:-}
      - MESH_DEVICE=${MESH_DEVICE:-N300}
      - WH_ARCH_YAML=${WH_ARCH_YAML:-}
      - TT_METAL_NUM_COMMAND_QUEUES=${TT_METAL_NUM_COMMAND_QUEUES:-}
      - BUILD_JOBS=${BUILD_JOBS:-16}
      # Reduce loguru verbosity (TT-NN uses loguru; default is DEBUG).
      - LOGURU_LEVEL=${LOGURU_LEVEL:-INFO}
      # TTNN runtime debug knob (can make ops blocking). Use only for correctness bring-up.
      - TTNN_CONFIG_OVERRIDES=${TTNN_CONFIG_OVERRIDES:-}
      # vLLM TT debug/perf: async host read of decode token ids (0/1).
      - TT_ASYNC_READ_DECODE=${TT_ASYNC_READ_DECODE:-}
      # Dev-specific: skip build if already done
      - SKIP_TT_METAL_BUILD=${SKIP_TT_METAL_BUILD:-0}
      - TT_LLAMA_TEXT_VER=${TT_LLAMA_TEXT_VER:-tt_transformers}
      - OVERRIDE_TT_CONFIG=${OVERRIDE_TT_CONFIG:-}
      # GLM UX/perf default: disable thinking unless explicitly re-enabled.
      - GLM_DEFAULT_DISABLE_THINKING=${GLM_DEFAULT_DISABLE_THINKING:-1}
      - GLM_CHAT_TEMPLATE_FILE=${GLM_CHAT_TEMPLATE_FILE:-/tmp/glm47_default_no_think.jinja}
      # GLM-4.7-Flash bring-up knobs (ignored by other models)
      - GLM4_MOE_LITE_CACHE_DIR=${GLM4_MOE_LITE_CACHE_DIR:-}
      - GLM4_MOE_LITE_NUM_LAYERS=${GLM4_MOE_LITE_NUM_LAYERS:-}
      - GLM4_MOE_LITE_DEBUG_ALLOW_PARTIAL_LAYERS=${GLM4_MOE_LITE_DEBUG_ALLOW_PARTIAL_LAYERS:-}
      - GLM4_MOE_LITE_KV_CACHE_TT_DTYPE=${GLM4_MOE_LITE_KV_CACHE_TT_DTYPE:-}
      - GLM4_MOE_LITE_PREFILL_IMPL=${GLM4_MOE_LITE_PREFILL_IMPL:-}
      - GLM4_MOE_LITE_PREFILL_INTERMEDIATE_SAMPLING=${GLM4_MOE_LITE_PREFILL_INTERMEDIATE_SAMPLING:-}
      - GLM4_MOE_LITE_SYNC_DEVICE=${GLM4_MOE_LITE_SYNC_DEVICE:-}
      - GLM4_MOE_LITE_SYNC_BEFORE_TRACE=${GLM4_MOE_LITE_SYNC_BEFORE_TRACE:-}
      - GLM4_MOE_LITE_SYNC_AFTER_KV_UPDATE=${GLM4_MOE_LITE_SYNC_AFTER_KV_UPDATE:-}
      - GLM4_MOE_LITE_CLEAR_KV_CACHE_BLOCK0=${GLM4_MOE_LITE_CLEAR_KV_CACHE_BLOCK0:-}
      - GLM4_MOE_LITE_SKIP_KV_UPDATE=${GLM4_MOE_LITE_SKIP_KV_UPDATE:-}
      - GLM4_MOE_LITE_PRESERVE_TRACE=${GLM4_MOE_LITE_PRESERVE_TRACE:-}
      - GLM4_MOE_LITE_ENABLE_MOE=${GLM4_MOE_LITE_ENABLE_MOE:-}
      - GLM4_MOE_LITE_DENSE_TT_DTYPE=${GLM4_MOE_LITE_DENSE_TT_DTYPE:-}
      - GLM4_MOE_LITE_EXPERTS_TT_DTYPE=${GLM4_MOE_LITE_EXPERTS_TT_DTYPE:-}
      - GLM4_MOE_LITE_EXPERTS_W1_DTYPE=${GLM4_MOE_LITE_EXPERTS_W1_DTYPE:-}
      - GLM4_MOE_LITE_EXPERTS_W2_DTYPE=${GLM4_MOE_LITE_EXPERTS_W2_DTYPE:-}
      - GLM4_MOE_LITE_EXPERTS_W3_DTYPE=${GLM4_MOE_LITE_EXPERTS_W3_DTYPE:-}
      - GLM4_MOE_LITE_TP=${GLM4_MOE_LITE_TP:-}
      - GLM4_MOE_LITE_FUSE_QKV_A=${GLM4_MOE_LITE_FUSE_QKV_A:-}
      - GLM4_MOE_LITE_MOE_FP32_ACC=${GLM4_MOE_LITE_MOE_FP32_ACC:-}
      - GLM4_MOE_LITE_MOE_EXPERTS_IMPL=${GLM4_MOE_LITE_MOE_EXPERTS_IMPL:-}
      - GLM4_MOE_LITE_MOE_ROUTER_IMPL=${GLM4_MOE_LITE_MOE_ROUTER_IMPL:-}
      - GLM4_MOE_LITE_ROUTER_L1=${GLM4_MOE_LITE_ROUTER_L1:-}
      - GLM4_MOE_LITE_FUSED_KV_BRANCH=${GLM4_MOE_LITE_FUSED_KV_BRANCH:-}
      - GLM4_MOE_LITE_FUSED_PRE_SDPA=${GLM4_MOE_LITE_FUSED_PRE_SDPA:-}
      - GLM4_MOE_LITE_HEAD_PARALLEL_KVB2=${GLM4_MOE_LITE_HEAD_PARALLEL_KVB2:-}
      - GLM4_MOE_LITE_MOE_SPARSE_CHUNK_TOKENS=${GLM4_MOE_LITE_MOE_SPARSE_CHUNK_TOKENS:-}
      - GLM4_MOE_LITE_MOE_SPARSE_FIDELITY=${GLM4_MOE_LITE_MOE_SPARSE_FIDELITY:-}
      - GLM4_MOE_LITE_MOE_SPARSE_FP32_ACC=${GLM4_MOE_LITE_MOE_SPARSE_FP32_ACC:-}
      - GLM4_MOE_LITE_MOE_SPARSE_APPROX=${GLM4_MOE_LITE_MOE_SPARSE_APPROX:-}
      - GLM4_MOE_LITE_MOE_SPARSE_DEBUG=${GLM4_MOE_LITE_MOE_SPARSE_DEBUG:-}
      - GLM4_MOE_LITE_MOE_SPARSE_DISPATCH_IMPL=${GLM4_MOE_LITE_MOE_SPARSE_DISPATCH_IMPL:-}
      - GLM4_MOE_LITE_MOE_SPARSE_FORCE_DENSE=${GLM4_MOE_LITE_MOE_SPARSE_FORCE_DENSE:-}
      - GLM4_MOE_LITE_EP_L1=${GLM4_MOE_LITE_EP_L1:-}
      - GLM4_MOE_LITE_FUSE_EXPERTS_GATE_UP=${GLM4_MOE_LITE_FUSE_EXPERTS_GATE_UP:-}
      - GLM4_MOE_LITE_MLA_SCALE_MODE=${GLM4_MOE_LITE_MLA_SCALE_MODE:-}
      - GLM4_MOE_LITE_MLA_FIDELITY=${GLM4_MOE_LITE_MLA_FIDELITY:-}
      - GLM4_MOE_LITE_MLA_APPROX=${GLM4_MOE_LITE_MLA_APPROX:-}
      - GLM4_MOE_LITE_MLA_FP32_ACC=${GLM4_MOE_LITE_MLA_FP32_ACC:-}
      - GLM4_MOE_LITE_MLA_K_CHUNK_SIZE=${GLM4_MOE_LITE_MLA_K_CHUNK_SIZE:-}
      - GLM4_MOE_LITE_MLA_USE_V_CACHE_SLICE=${GLM4_MOE_LITE_MLA_USE_V_CACHE_SLICE:-}
      - GLM4_MOE_LITE_MLA_SHARD_Q=${GLM4_MOE_LITE_MLA_SHARD_Q:-}
      - GLM4_MOE_LITE_USE_DECODE_ROPE=${GLM4_MOE_LITE_USE_DECODE_ROPE:-}
      - GLM4_MOE_LITE_PACKER_L1_ACC=${GLM4_MOE_LITE_PACKER_L1_ACC:-}
      - GLM4_MOE_LITE_PROFILE=${GLM4_MOE_LITE_PROFILE:-}
      - GLM4_MOE_LITE_PROFILE_LAYER=${GLM4_MOE_LITE_PROFILE_LAYER:-}
      - GLM4_MOE_LITE_PROFILE_PRINT_EVERY=${GLM4_MOE_LITE_PROFILE_PRINT_EVERY:-}
      - GLM4_MOE_LITE_DISABLE_FLASH_MLA_DECODE=${GLM4_MOE_LITE_DISABLE_FLASH_MLA_DECODE:-}
      - GLM4_MOE_LITE_DISABLE_MLP=${GLM4_MOE_LITE_DISABLE_MLP:-}
      - GLM4_MOE_LITE_LAYER_IDENTITY=${GLM4_MOE_LITE_LAYER_IDENTITY:-}
      - GLM4_MOE_LITE_DECODE_EMBED_ONLY=${GLM4_MOE_LITE_DECODE_EMBED_ONLY:-}
      - GLM4_MOE_LITE_DRAM_SHARDED_WEIGHTS=${GLM4_MOE_LITE_DRAM_SHARDED_WEIGHTS:-}
      - GLM4_MOE_LITE_DRAM_SHARDED_MLP=${GLM4_MOE_LITE_DRAM_SHARDED_MLP:-}
      - GLM4_MOE_LITE_DRAM_SHARDED_ATTN=${GLM4_MOE_LITE_DRAM_SHARDED_ATTN:-}
      - GLM4_MOE_LITE_EXPLICIT_PROG_CFG=${GLM4_MOE_LITE_EXPLICIT_PROG_CFG:-}
      - GLM4_MOE_LITE_DECODE_L1_ACT=${GLM4_MOE_LITE_DECODE_L1_ACT:-}
      - GLM4_MOE_LITE_MLP_FIDELITY=${GLM4_MOE_LITE_MLP_FIDELITY:-}
      - GLM4_MOE_LITE_MLP_APPROX=${GLM4_MOE_LITE_MLP_APPROX:-}
      - GLM4_MOE_LITE_DEBUG_PAGE_TABLE_BOUNDARY=${GLM4_MOE_LITE_DEBUG_PAGE_TABLE_BOUNDARY:-}
      - GLM4_MOE_LITE_DEBUG_LOGITS_SANITY=${GLM4_MOE_LITE_DEBUG_LOGITS_SANITY:-}
      # Debug-only: disable explicit TTNN deallocations (can increase memory usage).
      - GLM4_MOE_LITE_DISABLE_DEALLOC=${GLM4_MOE_LITE_DISABLE_DEALLOC:-}
      - GLM4_MOE_LITE_CONCAT_HEADS=${GLM4_MOE_LITE_CONCAT_HEADS:-}
      - GLM4_MOE_LITE_BATCHED_PREFILL=${GLM4_MOE_LITE_BATCHED_PREFILL:-}
      - GLM4_MOE_LITE_MOE_SPARSE_PREFILL_PCM=${GLM4_MOE_LITE_MOE_SPARSE_PREFILL_PCM:-}
      - GLM4_MOE_LITE_MOE_DENSE_PREFILL=${GLM4_MOE_LITE_MOE_DENSE_PREFILL:-}
      - GLM4_MOE_LITE_MOE_PACKED_PREFILL=${GLM4_MOE_LITE_MOE_PACKED_PREFILL:-}
      - GLM4_MOE_LITE_ATTN_DP=${GLM4_MOE_LITE_ATTN_DP:-}
      - GLM4_MOE_LITE_FUSE_MLP_MOE_REDUCE=${GLM4_MOE_LITE_FUSE_MLP_MOE_REDUCE:-}
      - GLM4_MOE_LITE_FUSE_SHARED_GATE_UP=${GLM4_MOE_LITE_FUSE_SHARED_GATE_UP:-}
      - GLM4_MOE_LITE_FUSED_SHARED_EXPERT=${GLM4_MOE_LITE_FUSED_SHARED_EXPERT:-0}
      - GLM4_MOE_LITE_FUSED_MOE=${GLM4_MOE_LITE_FUSED_MOE:-}
      - GLM4_MOE_LITE_SHARDED_MLP=${GLM4_MOE_LITE_SHARDED_MLP:-}
      - GLM4_MOE_LITE_SKIP_DEFENSIVE_CLONES=${GLM4_MOE_LITE_SKIP_DEFENSIVE_CLONES:-}
      - GLM4_MOE_LITE_MTP=${GLM4_MOE_LITE_MTP:-}
      - GLM4_MOE_LITE_MTP_TRACED=${GLM4_MOE_LITE_MTP_TRACED:-}
      - GLM4_MOE_LITE_BATCH_EXPAND=${GLM4_MOE_LITE_BATCH_EXPAND:-}
      - VLLM_SPECULATIVE_CONFIG=${VLLM_SPECULATIVE_CONFIG:-}
      - VLLM_USE_V1=${VLLM_USE_V1:-}
      # TT-Metal device profiler knobs
      - TT_METAL_DEVICE_PROFILER=${TT_METAL_DEVICE_PROFILER:-}
      - TT_METAL_TRACE_PROFILER=${TT_METAL_TRACE_PROFILER:-}
      - TT_METAL_PROFILER_SYNC=${TT_METAL_PROFILER_SYNC:-}
      - TT_METAL_PROFILER_DIR=${TT_METAL_PROFILER_DIR:-}
      - TT_METAL_PROFILER_CPP_POST_PROCESS=${TT_METAL_PROFILER_CPP_POST_PROCESS:-}
      - TT_METAL_PROFILER_MID_RUN_DUMP=${TT_METAL_PROFILER_MID_RUN_DUMP:-}
      - TT_METAL_PROFILER_PROGRAM_SUPPORT_COUNT=${TT_METAL_PROFILER_PROGRAM_SUPPORT_COUNT:-}
      - TTNN_OP_PROFILER=${TTNN_OP_PROFILER:-}
      - GLM4_MOE_LITE_TRACY_DUMP_AFTER=${GLM4_MOE_LITE_TRACY_DUMP_AFTER:-}
      # Architecture override (e.g. blackhole)
      - ARCH_NAME=${ARCH_NAME:-}
      # Pre-downloaded model weights path
      - MODEL_WEIGHTS_PATH=${MODEL_WEIGHTS_PATH:-}
      # Additional GLM bring-up knobs
      - GLM4_MOE_LITE_TP_PREFILL=${GLM4_MOE_LITE_TP_PREFILL:-}
      - GLM4_MOE_LITE_SKIP_TYPECAST=${GLM4_MOE_LITE_SKIP_TYPECAST:-}
    command:
      - --max-model-len=${MAX_MODEL_LEN:-32768}
      - --max-num-seqs=${MAX_NUM_SEQS:-32}
      - --block-size=${VLLM_BLOCK_SIZE:-64}
      - --port=8088
      - --enable-prefix-caching
      # --num-scheduler-steps=10  # NOT SUPPORTED by this vLLM version
      # Required for OpenAI "tools" requests (used by opencode and many UIs).
      - --enable-auto-tool-choice
      - --tool-call-parser=glm47
      # NOTE: Do NOT enable a reasoning parser by default.
      #
      # The `glm45` parser expects the model output stream to contain <think>...
      # </think> tokens, and will treat missing/garbled tokenization as
      # "reasoning not ended", suppressing visible `content` deltas. This makes
      # correctness validation and TTFT measurement brittle during bring-up.
      #
      # For GLM, we disable thinking via `GLM_DEFAULT_DISABLE_THINKING=1` and a
      # patched chat template. If/when we re-enable reasoning, add
      # `--reasoning-parser` back behind a dedicated env-file.
      - --override-tt-config=${OVERRIDE_TT_CONFIG:-{}}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      start_period: 1800s
      retries: 3
    ipc: host
    privileged: true
    restart: "no"

volumes:
  tt-metal-build:
    name: tt-metal-build-cache
  vllm-tt-venv:
    name: vllm-tt-venv-cache
