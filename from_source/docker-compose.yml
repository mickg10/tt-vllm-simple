include:
  - path: ../base/docker-compose.yml

services:
  vllm-tt:
    build:
      context: ..
      dockerfile: from_source/Dockerfile
      args:
        TT_METAL_REPO: ${TT_METAL_REPO:-https://github.com/tenstorrent/tt-metal.git}
        TT_METAL_REF: ${TT_METAL_REF:-main}
        VLLM_REPO: ${VLLM_REPO:-https://github.com/tenstorrent/vllm.git}
        VLLM_REF: ${VLLM_REF:-dev}
        BUILD_JOBS: ${BUILD_JOBS:-16}
    image: vllm-tt-source:latest
    networks:
      - tt-net
    ports:
      - "8088:8088"
    devices:
      - /dev/tenstorrent:/dev/tenstorrent
    volumes:
      - /dev/hugepages-1G:/dev/hugepages-1G
      - ${HOME}/.cache/huggingface:/cache/huggingface
      - ${HOME}/.cache/tt-model-cache:/tt-metal/model_cache
      - ${HOME}/.cache/ttnn:/root/.cache/ttnn
      - ${HOME}/.cache/tt-metal-cache:/root/.cache/tt-metal-cache
    environment:
      - HF_MODEL=${HF_MODEL:-Qwen/Qwen3-0.6B}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/cache/huggingface
      - VLLM_RPC_TIMEOUT=${VLLM_RPC_TIMEOUT:-600000}
      - VLLM_ENGINE_ITERATION_TIMEOUT_S=${VLLM_ENGINE_ITERATION_TIMEOUT_S:-}
      - MESH_DEVICE=${MESH_DEVICE:-N300}
      - WH_ARCH_YAML=${WH_ARCH_YAML:-}
      - TT_METAL_NUM_COMMAND_QUEUES=${TT_METAL_NUM_COMMAND_QUEUES:-}
      # Reduce loguru verbosity (TT-NN uses loguru; default is DEBUG).
      - LOGURU_LEVEL=${LOGURU_LEVEL:-INFO}
      # TTNN runtime debug knob (can make ops blocking). Use only for correctness bring-up.
      - TTNN_CONFIG_OVERRIDES=${TTNN_CONFIG_OVERRIDES:-}
      # vLLM TT debug/perf: async host read of decode token ids (0/1).
      - TT_ASYNC_READ_DECODE=${TT_ASYNC_READ_DECODE:-}
      # GLM UX/perf default: disable thinking unless explicitly re-enabled.
      - GLM_DEFAULT_DISABLE_THINKING=${GLM_DEFAULT_DISABLE_THINKING:-1}
      - GLM_CHAT_TEMPLATE_FILE=${GLM_CHAT_TEMPLATE_FILE:-/tmp/glm47_default_no_think.jinja}
      # GLM-4.7-Flash bring-up knobs (ignored by other models)
      - GLM4_MOE_LITE_CACHE_DIR=${GLM4_MOE_LITE_CACHE_DIR:-}
      - GLM4_MOE_LITE_NUM_LAYERS=${GLM4_MOE_LITE_NUM_LAYERS:-}
      - GLM4_MOE_LITE_DEBUG_ALLOW_PARTIAL_LAYERS=${GLM4_MOE_LITE_DEBUG_ALLOW_PARTIAL_LAYERS:-}
      - GLM4_MOE_LITE_KV_CACHE_TT_DTYPE=${GLM4_MOE_LITE_KV_CACHE_TT_DTYPE:-}
      - GLM4_MOE_LITE_PREFILL_IMPL=${GLM4_MOE_LITE_PREFILL_IMPL:-}
      - GLM4_MOE_LITE_PREFILL_INTERMEDIATE_SAMPLING=${GLM4_MOE_LITE_PREFILL_INTERMEDIATE_SAMPLING:-}
      - GLM4_MOE_LITE_SYNC_DEVICE=${GLM4_MOE_LITE_SYNC_DEVICE:-}
      - GLM4_MOE_LITE_SYNC_BEFORE_TRACE=${GLM4_MOE_LITE_SYNC_BEFORE_TRACE:-}
      - GLM4_MOE_LITE_SYNC_AFTER_KV_UPDATE=${GLM4_MOE_LITE_SYNC_AFTER_KV_UPDATE:-}
      - GLM4_MOE_LITE_CLEAR_KV_CACHE_BLOCK0=${GLM4_MOE_LITE_CLEAR_KV_CACHE_BLOCK0:-}
      - GLM4_MOE_LITE_SKIP_KV_UPDATE=${GLM4_MOE_LITE_SKIP_KV_UPDATE:-}
      - GLM4_MOE_LITE_ENABLE_MOE=${GLM4_MOE_LITE_ENABLE_MOE:-}
      - GLM4_MOE_LITE_DENSE_TT_DTYPE=${GLM4_MOE_LITE_DENSE_TT_DTYPE:-}
      - GLM4_MOE_LITE_EXPERTS_TT_DTYPE=${GLM4_MOE_LITE_EXPERTS_TT_DTYPE:-}
      - GLM4_MOE_LITE_TP=${GLM4_MOE_LITE_TP:-}
      - GLM4_MOE_LITE_FUSE_QKV_A=${GLM4_MOE_LITE_FUSE_QKV_A:-}
      - GLM4_MOE_LITE_MOE_FP32_ACC=${GLM4_MOE_LITE_MOE_FP32_ACC:-}
      - GLM4_MOE_LITE_MOE_EXPERTS_IMPL=${GLM4_MOE_LITE_MOE_EXPERTS_IMPL:-}
      - GLM4_MOE_LITE_MOE_ROUTER_IMPL=${GLM4_MOE_LITE_MOE_ROUTER_IMPL:-}
      - GLM4_MOE_LITE_MOE_SPARSE_CHUNK_TOKENS=${GLM4_MOE_LITE_MOE_SPARSE_CHUNK_TOKENS:-}
      - GLM4_MOE_LITE_MOE_SPARSE_FIDELITY=${GLM4_MOE_LITE_MOE_SPARSE_FIDELITY:-}
      - GLM4_MOE_LITE_MOE_SPARSE_FP32_ACC=${GLM4_MOE_LITE_MOE_SPARSE_FP32_ACC:-}
      - GLM4_MOE_LITE_MOE_SPARSE_APPROX=${GLM4_MOE_LITE_MOE_SPARSE_APPROX:-}
      - GLM4_MOE_LITE_MOE_SPARSE_DEBUG=${GLM4_MOE_LITE_MOE_SPARSE_DEBUG:-}
      - GLM4_MOE_LITE_MOE_SPARSE_DISPATCH_IMPL=${GLM4_MOE_LITE_MOE_SPARSE_DISPATCH_IMPL:-}
      - GLM4_MOE_LITE_MOE_SPARSE_FORCE_DENSE=${GLM4_MOE_LITE_MOE_SPARSE_FORCE_DENSE:-}
      - GLM4_MOE_LITE_MLA_SCALE_MODE=${GLM4_MOE_LITE_MLA_SCALE_MODE:-}
      - GLM4_MOE_LITE_MLA_FIDELITY=${GLM4_MOE_LITE_MLA_FIDELITY:-}
      - GLM4_MOE_LITE_MLA_APPROX=${GLM4_MOE_LITE_MLA_APPROX:-}
      - GLM4_MOE_LITE_MLA_FP32_ACC=${GLM4_MOE_LITE_MLA_FP32_ACC:-}
      - GLM4_MOE_LITE_MLA_K_CHUNK_SIZE=${GLM4_MOE_LITE_MLA_K_CHUNK_SIZE:-}
      - GLM4_MOE_LITE_MLA_USE_V_CACHE_SLICE=${GLM4_MOE_LITE_MLA_USE_V_CACHE_SLICE:-}
      - GLM4_MOE_LITE_MLA_SHARD_Q=${GLM4_MOE_LITE_MLA_SHARD_Q:-}
      - GLM4_MOE_LITE_USE_DECODE_ROPE=${GLM4_MOE_LITE_USE_DECODE_ROPE:-}
      - GLM4_MOE_LITE_PACKER_L1_ACC=${GLM4_MOE_LITE_PACKER_L1_ACC:-}
      - GLM4_MOE_LITE_PROFILE=${GLM4_MOE_LITE_PROFILE:-}
      - GLM4_MOE_LITE_PROFILE_LAYER=${GLM4_MOE_LITE_PROFILE_LAYER:-}
      - GLM4_MOE_LITE_PROFILE_PRINT_EVERY=${GLM4_MOE_LITE_PROFILE_PRINT_EVERY:-}
      - GLM4_MOE_LITE_DISABLE_FLASH_MLA_DECODE=${GLM4_MOE_LITE_DISABLE_FLASH_MLA_DECODE:-}
      - GLM4_MOE_LITE_DISABLE_MLP=${GLM4_MOE_LITE_DISABLE_MLP:-}
      - GLM4_MOE_LITE_LAYER_IDENTITY=${GLM4_MOE_LITE_LAYER_IDENTITY:-}
      - GLM4_MOE_LITE_DECODE_EMBED_ONLY=${GLM4_MOE_LITE_DECODE_EMBED_ONLY:-}
      - GLM4_MOE_LITE_DEBUG_PAGE_TABLE_BOUNDARY=${GLM4_MOE_LITE_DEBUG_PAGE_TABLE_BOUNDARY:-}
      - GLM4_MOE_LITE_DEBUG_LOGITS_SANITY=${GLM4_MOE_LITE_DEBUG_LOGITS_SANITY:-}
      # Debug-only: disable explicit TTNN deallocations (can increase memory usage).
      - GLM4_MOE_LITE_DISABLE_DEALLOC=${GLM4_MOE_LITE_DISABLE_DEALLOC:-}
    command:
      - --max-model-len=${MAX_MODEL_LEN:-32768}
      - --max-num-seqs=${MAX_NUM_SEQS:-32}
      - --block-size=64
      - --port=8088
      - --enable-prefix-caching
      # Required for OpenAI "tools" requests (used by opencode and many UIs).
      - --enable-auto-tool-choice
      - --tool-call-parser=glm47
      - --override-tt-config=${OVERRIDE_TT_CONFIG:-{}}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    ipc: host
    privileged: true
    restart: unless-stopped
