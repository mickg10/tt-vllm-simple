services:
  # vLLM server with small model (Qwen3-0.6B)
  # Use: docker compose --profile small up -d (or just: docker compose up -d)
  vllm-tt:
    build:
      context: .
    image: vllm-tt:latest
    ports:
      - "8088:8088"
    devices:
      - /dev/tenstorrent:/dev/tenstorrent
    volumes:
      - /dev/hugepages-1G:/dev/hugepages-1G
      - ${HOME}/.cache/huggingface:/cache/huggingface
    environment:
      - HF_MODEL=${HF_MODEL:-Qwen/Qwen3-0.6B}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/cache/huggingface
      - VLLM_RPC_TIMEOUT=${VLLM_RPC_TIMEOUT:-300000}
      - TT_METAL_RESET_DEVICES=${TT_METAL_RESET_DEVICES:-0}
    ipc: host
    privileged: true
    restart: unless-stopped
    profiles:
      - small
      - ""

  # vLLM server with Qwen3-32B (large model)
  # Use: docker compose --profile 32b up -d
  vllm-tt-32b:
    build:
      context: .
    image: vllm-tt:latest
    ports:
      - "8088:8088"
    devices:
      - /dev/tenstorrent:/dev/tenstorrent
    volumes:
      - /dev/hugepages-1G:/dev/hugepages-1G
      - ${HOME}/.cache/huggingface:/cache/huggingface
    environment:
      - HF_MODEL=Qwen/Qwen3-32B
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/cache/huggingface
      - VLLM_RPC_TIMEOUT=${VLLM_RPC_TIMEOUT:-600000}
      - TT_METAL_RESET_DEVICES=1
    ipc: host
    privileged: true
    restart: unless-stopped
    profiles:
      - 32b
      - large

  # Open WebUI frontend (always runs)
  # Access at http://localhost:3000
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    network_mode: host
    environment:
      - OPENAI_API_KEY=not-needed
      - OPENAI_API_BASE_URL=http://localhost:8088/v1
      - OLLAMA_API_BASE_URL=
      - ENV=prod
      - PORT=3000
      - USE_OLLAMA_DOCKER=false
      - SCARF_NO_ANALYTICS=true
      - DO_NOT_TRACK=true
      - ANONYMIZED_TELEMETRY=false
      - RAG_EMBEDDING_MODEL=
      - RAG_EMBEDDING_ENGINE=
      - USE_EMBEDDING_MODEL_DOCKER=
      - AUXILIARY_EMBEDDING_MODEL=
      - ENABLE_RAG_WEB_LOADER_SSL_VERIFICATION=False
      - ENABLE_RAG_WEB_SEARCH=False
      - HF_HUB_OFFLINE=1
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

  # TT Device Monitor - Dashboard and Prometheus metrics
  # Access at http://localhost:9090 (dashboard) or http://localhost:9090/metrics (prometheus)
  # Uses sysfs/hwmon to read device metrics (no locks, works while vLLM is running)
  # Scrapes vLLM metrics from http://localhost:8088/metrics
  tt-monitor:
    build:
      context: ./tt-monitor
    image: tt-monitor:latest
    network_mode: host
    volumes:
      # Mount sysfs read-only for hwmon/device telemetry access
      - /sys:/sys:ro
      # Persistent data storage for SQLite database (metrics history)
      - tt-monitor-data:/data
    environment:
      - TT_MONITOR_MOCK=${TT_MONITOR_MOCK:-0}
      - FRONTEND_PATH=/app/frontend/dist
      - VLLM_METRICS_URL=http://localhost:8088/metrics
      - TT_MONITOR_DATA_DIR=/data
    restart: unless-stopped

volumes:
  open-webui-data:
  tt-monitor-data:
